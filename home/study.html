<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница с обрамлением</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .logo-badge {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            background: #f8f9fa;   /* светлый фон */
            color: #212529;        /* тёмная буква */
        }
        /* «хвостик» — маленький квадратик внизу слева */
        .logo-badge::after {
            content: "";
            position: absolute;
            left: 3px;
            bottom: -3px;
            width: 7px;
            height: 7px;
            background: inherit;       /* тот же цвет, что и фон */
            border-radius: 0 0 0 5px;
            transform: skewX(-15deg);
        }
        html, body { height: 100%; margin: 0; }
    </style>
</head>
<body class="p-2">
    <div class="border border-1 border-black rounded-3 h-100 d-flex overflow-hidden">
        <!-- ЧЁРНЫЙ СТОЛБЕЦ -->
        <div class="bg-black text-white p-3" style="width: 20%;">
            <h4 class="mb-4 d-flex align-items-center">
                <span class="d-inline-flex align-items-center justify-content-center
                             bg-light text-dark fw-bold rounded-2 me-2"
                      style="width: 32px; height: 32px;">
                    B
                </span>
                Меню
            </h4>
            <div class="d-grid gap-2 col-6 mx-auto">
                <button class="btn-solid theme-primary" type="button">Button</button>
                <button class="btn-solid theme-primary" type="button">Button</button>
                <button class="btn-solid theme-primary" type="button">Button</button>
            </div>
        </div>

        <!-- СВЕТЛЫЙ СТОЛБЕЦ -->
        <div class="flex-grow-1 p-3">
            <br><br><br><h1 class="text-center">Главная</h1>
            <h6 class="text-center text-secondary" >
            Вы находитесь на сайте, предназначенном для продажи товаров
            </h6>

        </div>

    </div>
</body>
</html>
